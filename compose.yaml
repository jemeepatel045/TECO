services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [teco-net]

  teco-a:
    build: .
    command: ["teco_server", "--port", "8080", "--backend", "redis", "--redis-host", "redis", "--redis-port", "6379", "--ttl-ms", "300000"]
    environment:
      TECO_BIND_ALL: "1"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks: [teco-net]

  teco-b:
    build: .
    command: ["teco_server", "--port", "8080", "--backend", "redis", "--redis-host", "redis", "--redis-port", "6379", "--ttl-ms", "300000"]
    environment:
      TECO_BIND_ALL: "1"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks: [teco-net]

networks:
  teco-net:
    driver: bridge
